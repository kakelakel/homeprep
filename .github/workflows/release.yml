name: Publish HomePrep release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish current manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version, release type and changelog
        id: release_data
        shell: bash
        run: |
          python <<'PY'
          import json
          import re
          from pathlib import Path

          version = json.loads(Path("custom_components/homeprep/manifest.json").read_text())["version"]
          prerelease = bool(re.search(r"(?:a|b|rc)\d+$", version, flags=re.I))

          changelog = Path("CHANGELOG.md").read_text()
          pattern = rf"^## \[{re.escape(version)}\].*?\n(.*?)(?=^## \[|^## Earlier development|\Z)"
          match = re.search(pattern, changelog, flags=re.M | re.S)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for version {version}")

          Path("release-notes.md").write_text(match.group(1).strip() + "\n")
          with Path("release-data.env").open("w") as env_file:
              env_file.write(f"VERSION={version}\n")
              env_file.write(f"PRERELEASE={'true' if prerelease else 'false'}\n")
          PY

          cat release-data.env >> "$GITHUB_ENV"
          source release-data.env
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_ARGS=()
          if [ "${PRERELEASE}" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "HomePrep v${VERSION}" \
            --notes-file release-notes.md \
            "${EXTRA_ARGS[@]}"
